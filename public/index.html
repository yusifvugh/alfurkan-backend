<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خادم الفُرقان - Backend API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      text-align: center;
      width: 100%;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 1.5rem;
      font-size: 0.95rem;
    }
    .endpoints {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      text-align: right;
      font-family: monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .endpoints div {
      padding: 0.35rem 0;
      display: flex;
      justify-content: space-between;
    }
    .method {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      الخدمة تعمل بنجاح (Online)
    </div>
    <h1>مركز تحكم الفُرقان</h1>
    <p>واجهة برمجة التطبيقات (API) ت عمل على منصة Vercel بنجاح.</p>
    <div class="endpoints">
      <div><span>/api/monitoring/health</span><span class="method">GET</span></div>
      <div><span>/api/announcements/active</span><span class="method">GET</span></div>
      <div><span>/api/studio/stats</span><span class="method">GET</span></div>
    </div>
  </div>
</body>
</html>
