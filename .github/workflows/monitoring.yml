name: External Monitoring

on:
  schedule:
    - cron: '*/15 * * * *'  # كل 15 دقيقة
  workflow_dispatch:  # تشغيل يدوي

jobs:
  health-check:
    name: Health Check (15min)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API Health
        id: health
        run: |
          RAW_URL="${{ secrets.API_BASE_URL }}"
          # Ensure URL starts with https://
          SAFE_URL=$(echo "$RAW_URL" | sed 's|^http://|https://|' | sed 's|/$||')
          TARGET="${SAFE_URL}/api/monitoring/health"
          echo "Target URL: $TARGET"
          
          response=$(curl -sL -w "\n%{http_code}" --max-time 20 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$TARGET" || echo -e "\n000")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          echo "http_code=$http_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
      - name: Parse Health Results
        if: steps.health.outputs.http_code == '200'
        run: |
          echo "${{ steps.health.outputs.body }}" | jq -r '.checks[]? | "\(.name): \(.status) \(.latencyMs // "")ms \(.details)"' || true
          
      - name: Check for Down Services
        if: steps.health.outputs.http_code == '200'
        id: down_check
        run: |
          down_count=$(echo '${{ steps.health.outputs.body }}' | jq '[.checks[]? | select(.status == "down")] | length' || echo 0)
          echo "down_count=$down_count" >> $GITHUB_OUTPUT
          if [ "$down_count" != "0" ]; then
            echo "has_down=true" >> $GITHUB_OUTPUT
          fi

  # Deep health check every 15 minutes (more comprehensive)
  deep-health-check:
    name: Deep Health Check (15min)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: false
    steps:
      - name: Deep Health Check
        run: |
          echo "Deep check skipped"

  # Daily summary at 9 AM UTC (6 AM Cairo)
  daily-summary:
    name: Daily Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * *'
    steps:
      - name: Trigger Daily Summary
        run: |
          RAW_URL="${{ secrets.API_BASE_URL }}"
          SAFE_URL=$(echo "$RAW_URL" | sed 's|^http://|https://|' | sed 's|/$||')
          curl -f -sL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${SAFE_URL}/api/monitoring/daily-summary" || true
